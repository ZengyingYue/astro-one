- id: session-telemetry-otel
  disabled: true
- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- insert:
    - id: product-telemetry-otel
      name: '@astro-one/host-product-telemetry-otel'
      config:
        endpoint: !!js process.env.ASTRO_ONE_PRODUCT_TELEMETRY_TEST_ENDPOINT
        serviceName: astro-one-telemetry-test
        serviceVersion: !!js process.env.ASTRO_ONE_APP_VERSION
        compression: gzip
        scheduledDelayMillis: 60000
