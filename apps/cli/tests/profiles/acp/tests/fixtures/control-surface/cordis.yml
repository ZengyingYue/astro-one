# Keyless generic ACP v1 control-surface patch over `astro-one --profile acp`.

- id: llm-deepseek
  name: '@astro-one/llm-deepseek'
  disabled: true

- id: acp
  name: '@astro-one/acp'
  config:
    provider: control-fixture
    model: alpha

- id: session-persistence-jsonl
  name: '@astro-one/session-persistence-jsonl'
  config:
    root: !!js process.env.ASTRO_ONE_CONFORMANCE_PERSISTENCE_ROOT
    compression: none

- insert:
    - id: control-surface-llm
      name: './control-surface-llm.ts'
