# Workspace-context snapshot patch: keep project-root and user-global
# discovery inside the scenario's temporary cwd.
- id: agent-default-model
  name: '@astro-one/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@astro-one/session-persistence-jsonl'
  config:
    root: !!js astroOneHomePath('sessions')
    compression: !!js 'process.env.ASTRO_ONE_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@astro-one/agent-instructions'
  config:
    maxBytes: 65536
    astroOneHome: !!js process.cwd() + '/.astro-one'
    projectRootMarkers:
      - .astro-one-project

- id: system-prompt
  name: '@astro-one/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.
