# Minimal live counterpart for the glob-sampling snapshot composition.
- id: llm-deepseek
  name: '@astro-one/llm-deepseek'
  config:
    models:
      - id: deepseek-v4-pro

- id: subprocess
  name: '@astro-one/subprocess-local'

- id: agent-default-model
  name: '@astro-one/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@astro-one/session-persistence-jsonl'
  config:
    root: !!js astroOneHomePath('sessions')
    compression: !!js 'process.env.ASTRO_ONE_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@astro-one/agent-instructions'
  disabled: true

- id: system-prompt
  name: '@astro-one/system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent working in {{cwd}}.

- id: tool-jobs
  name: '@astro-one/tool-jobs'
  disabled: true

- id: goal
  name: '@astro-one/goal'
  disabled: true

- id: goal-round-driver
  name: '@astro-one/goal-round-driver'
  disabled: true

- id: command-goal
  name: '@astro-one/command-goal'
  disabled: true

- id: tool-goal
  name: '@astro-one/tool-goal'
  disabled: true

- id: skill
  name: '@astro-one/skill'
  disabled: true

- id: skill-filesystem
  name: '@astro-one/skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@astro-one/tool-skill'
  disabled: true

- id: tool-fs-search
  name: '@astro-one/tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4

- id: spill-local
  name: '@astro-one/spill-local'
  config:
    root: !!js process.env.ASTRO_ONE_SNAPSHOT_SPILL_ROOT ?? './.spill'

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.ASTRO_ONE_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.ASTRO_ONE_SNAPSHOT_SPILL_LOCATOR_ROOT
