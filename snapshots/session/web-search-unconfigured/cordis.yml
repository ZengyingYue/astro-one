# Live-recording patch: the search key reference names no credential, so the
# model request withholds web_search while the rest of the tool surface stays.
- id: web-deepseek-api
  name: '@astro-one/web-deepseek-api'
  config:
    searchApiKeyEnv: ASTRO_ONE_SNAPSHOT_UNSET_SEARCH_KEY

- id: web-search-deepseek
  config:
    apiKeyEnv: ASTRO_ONE_SNAPSHOT_UNSET_SEARCH_KEY
