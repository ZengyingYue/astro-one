- insert:
    - id: mcp-resource-catalog
      name: '@astro-one/mcp-client'
      config:
        transport: stdio
        serverName: catalog
        command: !!js process.execPath
        args: !!js '[process.env.ASTRO_ONE_MCP_RESOURCES_FIXTURE]'
        failOnStartupError: true
        reconnect:
          enabled: false

- id: tools
  name: '@astro-one/tools'
  config:
    mode: ptc
