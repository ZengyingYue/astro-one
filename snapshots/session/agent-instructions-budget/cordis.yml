# Workspace-context snapshot patch: the harness exports ASTRO_ONE_HOME=<cwd>/.astro-one and
# ASTRO_ONE_AGENTS_HOME=<cwd>/.agents, so project-root and both user-global root
# discoveries stay inside the scenario's temporary cwd.
- id: agent-default-model
  name: '@astro-one/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@astro-one/session-persistence-jsonl'
  config:
    root: !!js astroOneHomePath('sessions')
    compression: !!js 'process.env.ASTRO_ONE_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@astro-one/agent-instructions'
  config:
    maxBytes: 700
    projectRootMarkers:
      - .astro-one-project

- id: system-prompt
  name: '@astro-one/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.
