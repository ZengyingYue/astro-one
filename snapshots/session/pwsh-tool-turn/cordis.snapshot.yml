# Minimal keyless composition: real app, pwsh executor, and pwsh tool; replayed model.
- id: llm-deepseek
  name: '@astro-one/llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@astro-one/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-pro

- id: subprocess
  name: '@astro-one/subprocess-local'

- id: bash-sandbox
  name: '@astro-one/bash-sandbox'
  disabled: true

- id: pwsh-sandbox
  name: '@astro-one/pwsh-sandbox'
  disabled: false

- id: shell-env
  name: '@astro-one/shell-env'

- id: agent-default-model
  name: '@astro-one/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@astro-one/session-persistence-jsonl'
  config:
    root: !!js astroOneHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@astro-one/agent-instructions'
  disabled: true

- id: system-prompt
  name: '@astro-one/system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent working in {{cwd}}.

- id: goal
  name: '@astro-one/goal'
  disabled: true

- id: goal-round-driver
  name: '@astro-one/goal-round-driver'
  disabled: true

- id: command-goal
  name: '@astro-one/command-goal'
  disabled: true

- id: tool-goal
  name: '@astro-one/tool-goal'
  disabled: true

- id: skill
  name: '@astro-one/skill'
  disabled: true

- id: skill-filesystem
  name: '@astro-one/skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@astro-one/tool-skill'
  disabled: true

- id: tool-bash
  name: '@astro-one/tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@astro-one/tool-pwsh'
  disabled: false
