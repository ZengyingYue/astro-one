- id: llm-deepseek
  name: '@astro-one/llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: agent-default-model
  name: '@astro-one/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@astro-one/session-persistence-jsonl'
  config:
    root: !!js astroOneHomePath('sessions')
    compression: none

- id: tool-executor-native
  disabled: false

- id: tool-executor-ptc
  disabled: true

- id: system-prompt
  name: '@astro-one/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@astro-one/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash-vision-exp
                inputModalities: [text, image]

- id: attachment-local
  name: '@astro-one/attachment-local'

- insert:
    - id: computer-use
      name: '@astro-one/computer-use'
    - id: cua-native
      name: '@astro-one/experimental-cua-macos'
      config:
        agentPreset: false
        helperPath: !!js process.cwd() + '/native-helper.mjs'
        allowedApps: [{"id": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", "name": "Fixture", "executablePath": "/fixture/app"}]

- id: user-questions
  name: '@astro-one/user-questions'

- insert:
    - id: cua-permission-fixture
      name: './permission-fixture.mjs'
