# The recorded request header selects the replay route. This keeps model
# selection in session JSONL instead of duplicating it across manifests.

- id: agent-default-model
  name: '@astro-one/agent-default-model'
  config:
    provider: !!js process.env.ASTRO_ONE_SNAPSHOT_PROVIDER
    model: !!js process.env.ASTRO_ONE_SNAPSHOT_MODEL
