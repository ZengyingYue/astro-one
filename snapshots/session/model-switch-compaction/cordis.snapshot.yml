# The second request selects a smaller model before its header is committed.

- id: agent-instructions
  disabled: true

- id: llm-deepseek
  name: '@astro-one/llm-deepseek-api-key'
  disabled: true

- id: session-persistence-jsonl
  name: '@astro-one/session-persistence-jsonl'
  config:
    root: !!js astroOneHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@astro-one/compaction-basic'
  config:
    thresholdRatio: 0.8
    headroomTokens: 1800
    retainTokens: 20
    maxTokens: 32

- insert:
    - id: llm-replay
      name: '@astro-one/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 100000
                defaultMaxTokens: 1000
              - id: deepseek-v4-pro
                contextWindow: 8780
                defaultMaxTokens: 1000
    - id: compaction-working-directory
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/compaction-working-directory.ts'
    - id: model-switch-compaction-driver
      name: './driver.mjs'

# Fixed-budget compaction scenario: keep the recorded tool set, whose token counts the thresholds were tuned to.
- id: tool-fs
  config:
    applyPatch: false
